[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
wasmtime = "47.0"
wasmtime-wasi = { version = "47.0", features = ["p3"] }
wasmtime-wasi-http = { version = "47.0", features = ["p3"] }
wasi-webgpu-wasmtime = "0.2.0"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
tokio = { version = "1.53.1", features = ["macros"] }
env_logger = "0.11.11"
colored = "3.1.1"
