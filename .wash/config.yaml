build:
  # LLAMA_WIT_JSON_SCHEMA=ON builds provider-with-json-schema instead of provider.
  # One job per core: a bare `--parallel` would let Make spawn unlimited jobs.
  command: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/wasip3.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DLLAMA_WIT_JSON_SCHEMA="${LLAMA_WIT_JSON_SCHEMA:-OFF}" && cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"
  component_path: build/llama-cpp.wasm
