name: CI

# Builds the llama.cpp provider component (WebGPU backend) with `wash build`
# and checks it against wit/, once per world: `provider` exports the llama.h
# API, `provider-with-json-schema` also exports llama.cpp's JSON Schema to GBNF
# converter. On main it also publishes both to GHCR with a Sigstore-signed
# build-provenance attestation. So does integration/control-demo, which may only
# publish `-rc.N` prereleases, so it never takes a version main will release.
# There the cosmonic:llama-cpp WIT package, published with wkg, holds the
# llama-cpp tag, so only llama-cpp-with-json-schema is pushed.
#
# The package version in wit/llama.wit is the release version. A merge to main
# that bumps it publishes that version; any other merge finds the version
# already there and skips, so a published version is never moved. The publish
# job pushes the exact bytes the build job produced and checked rather than
# rebuilding, so the attestation covers what was tested.

on:
  push:
    branches: [main, integration/control-demo]
  pull_request:
  # Retries a publish from main without a new commit, e.g. after a registry outage.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR builds, but let main runs finish: cancelling one
  # mid-publish could leave a pushed version without its attestation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  WASI_SDK_VERSION: "34"
  WASH_VERSION: v2.9.0
  WASM_TOOLS_VERSION: 1.258.0
  # Must match the "Generated by `wit-bindgen`" header in src/generated/: the
  # bindings check regenerates with this version and fails on any difference.
  WIT_BINDGEN_VERSION: 0.59.0

jobs:
  build:
    name: Build component (${{ matrix.world }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - world: provider
            json-schema: "OFF"
            artifact: llama-cpp
          - world: provider-with-json-schema
            json-schema: "ON"
            artifact: llama-cpp-with-json-schema
    outputs:
      # The same in every leg: both come from the package declaration.
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package identity
        id: meta
        run: |
          set -euo pipefail
          # `package cosmonic:llama-cpp@0.5.0;` -> package cosmonic:llama-cpp and
          # version 0.5.0.
          decl=$(grep -m1 -oE '^package [a-z0-9-]+:[a-z0-9-]+@[^;]+' wit/llama.wit) \
            || { echo "::error::could not read the package declaration from wit/llama.wit"; exit 1; }
          decl=${decl#package }
          package=${decl%%@*}
          version=${decl#*@}

          # The version becomes the OCI tag. Resolvers ignore tags that are not
          # valid semver, and OCI tags cannot contain the `+` of build metadata.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package version '$version' in wit/llama.wit is not <major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          {
            echo "package=$package"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "$package version $version"

      - uses: bytecodealliance/actions/wit-bindgen/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WIT_BINDGEN_VERSION }}

      - name: Fail if the committed bindings are stale
        # src/generated/ is committed rather than generated during the build, so
        # a wit/ change without regenerating would still build and ship the old
        # interface. Same commands as the regenerate-bindings CMake target.
        run: |
          set -euo pipefail
          wit-bindgen c wit --world provider --out-dir src/generated
          wit-bindgen c wit --world provider-with-json-schema --rename-world provider --out-dir src/generated/provider-with-json-schema
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated/ does not match wit/; run the regenerate-bindings target with wit-bindgen ${WIT_BINDGEN_VERSION} and commit the result"
            git status --short -- src/generated
            exit 1
          fi

      - name: Install wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c # v1.0.0
        with:
          version: ${{ env.WASI_SDK_VERSION }}
          # cmake/wasip3.toolchain.cmake only reads WASI_SDK_PATH, which is always
          # exported. Leave PATH, CC and CXX alone so nothing else in the job
          # silently picks up the wasm compiler.
          add-to-path: false

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}

      - name: Versions
        run: |
          wash --version
          wasm-tools --version
          wit-bindgen --version
          "$WASI_SDK_PATH/bin/clang" --version
          cmake --version

      - name: Build
        # .wash/config.yaml runs the CMake configure + build.
        env:
          LLAMA_WIT_JSON_SCHEMA: ${{ matrix.json-schema }}
        run: wash build

      - name: Fail if wkg.lock moved
        # `wash build` fetches WIT dependencies and rewrites wkg.lock. A change
        # means the build resolved something nobody reviewed.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- wkg.lock)" ]; then
            echo "::error::wash build changed wkg.lock; commit the updated lock deliberately"
            git --no-pager diff -- wkg.lock
            exit 1
          fi

      - name: Check the test harness
        env:
          JSON_SCHEMA: ${{ matrix.json-schema }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-wasip2
          features=()
          if [ "$JSON_SCHEMA" = ON ]; then features=(--features json-schema); fi
          cargo build --manifest-path tests/guest/Cargo.toml --target wasm32-wasip2 --release --locked "${features[@]}"
          # The runner doesn't depend on the world, so test it in one leg only
          if [ "$JSON_SCHEMA" = OFF ]; then cargo test --manifest-path tests/runtime/Cargo.toml --locked; fi

      - name: Embed provenance metadata
        # `wash oci push` maps these onto org.opencontainers.image.* annotations;
        # `source` is what links the GHCR package to this repository. Runs before
        # the export check so that check sees the bytes that get published.
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          WORLD: ${{ matrix.world }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wasm-tools metadata add build/llama-cpp.wasm \
            --name "$ARTIFACT" \
            --version "$VERSION" \
            --description "llama.cpp inference with the WebGPU backend, as ${PACKAGE}/${WORLD}@${VERSION}" \
            --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision "$GITHUB_SHA" \
            --output "dist/${ARTIFACT}.wasm"
          wasm-tools metadata show "dist/${ARTIFACT}.wasm"

      - name: Assert the component exports its world and imports WebGPU
        # The bindings check covers the sources; this covers the linked result.
        # Also require the wasi:webgpu import, so the GPU backend can't drop out unnoticed.
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          JSON_SCHEMA: ${{ matrix.json-schema }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          wash inspect "dist/${ARTIFACT}.wasm" > "$RUNNER_TEMP/component.wit"
          grep -E '^\s*(import|export) ' "$RUNNER_TEMP/component.wit" || true
          api="${PACKAGE}/api@${VERSION}"
          json_schema="${PACKAGE}/json-schema@${VERSION}"
          grep -qF "export ${api};" "$RUNNER_TEMP/component.wit" \
            || { echo "::error::dist/${ARTIFACT}.wasm does not export ${api}"; exit 1; }
          if [ "$JSON_SCHEMA" = ON ]; then
            grep -qF "export ${json_schema};" "$RUNNER_TEMP/component.wit" \
              || { echo "::error::dist/${ARTIFACT}.wasm does not export ${json_schema}"; exit 1; }
          elif grep -qF "export ${json_schema};" "$RUNNER_TEMP/component.wit"; then
            echo "::error::dist/${ARTIFACT}.wasm exports ${json_schema}, which only provider-with-json-schema should"
            exit 1
          fi
          grep -qE '^\s*import wasi:webgpu/webgpu@' "$RUNNER_TEMP/component.wit" \
            || { echo "::error::dist/${ARTIFACT}.wasm does not import wasi:webgpu; is GGML_WEBGPU still on in CMakeLists.txt?"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.wasm
          if-no-files-found: error

  publish:
    name: Publish to GHCR (${{ matrix.world }})
    needs: build
    # Upstream main and integration/control-demo only: on a fork, IMAGE still
    # names the cosmonic-labs namespace, which the fork's token cannot write to.
    if: >-
      github.repository == 'cosmonic-labs/llama.wit' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/control-demo')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      # attest-build-provenance signs with a Sigstore certificate issued against
      # the job's OIDC token (id-token), stores the attestation with GitHub
      # (attestations) and records the artifact (artifact-metadata).
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Publishes to the package this repo already publishes to, laid out
          # as wkg's <registry>/<owner>/<namespace>/<package> for cosmonic:llama-cpp.
          - world: provider
            interfaces: api
            artifact: llama-cpp
            image: ghcr.io/cosmonic-labs/cosmonic/llama-cpp
          - world: provider-with-json-schema
            interfaces: api json-schema
            artifact: llama-cpp-with-json-schema
            image: ghcr.io/cosmonic-labs/cosmonic/llama-cpp-with-json-schema
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PACKAGE: ${{ needs.build.outputs.package }}
      # The interfaces the image has to export, as <package>/<name>@<version>
      INTERFACES: ${{ matrix.interfaces }}
      IMAGE: ${{ matrix.image }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - name: Refuse a release version from the integration branch
        if: github.ref == 'refs/heads/integration/control-demo'
        run: |
          [[ "$VERSION" =~ -rc\.[0-9]+$ ]] ||
            { echo "::error::integration/control-demo publishes only <version>-rc.N, not $VERSION"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      # wash and the attestation push read these credentials.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: check
        # Asks the registry directly and acts only on 200 or 404; anything else
        # (auth, outage) fails rather than risk pushing over a release.
        #   404                    not published yet: push it.
        #   200, this build's bytes an earlier attempt pushed it and then failed,
        #                          e.g. at attestation: attest it instead of
        #                          skipping, so re-running the job recovers.
        #   200, other bytes       an earlier merge published this version: skip.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/integration/control-demo && "$ARTIFACT" == llama-cpp ]]; then
            echo "::notice::${IMAGE}:${VERSION} holds the cosmonic:llama-cpp WIT package on this branch; not pushing the api-only component over it"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="${IMAGE#ghcr.io/}"
          token=$(curl -fsS -u "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull" | jq -r '.token // empty')
          [ -n "$token" ] || { echo "::error::ghcr.io issued no token for ${name}"; exit 1; }

          # Accept every manifest type, so whatever sits at the tag answers 200
          # rather than a 404 that would read as "free".
          manifest="$RUNNER_TEMP/manifest.json"
          status=$(curl -sS -o "$manifest" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${name}/manifests/${VERSION}")

          case "$status" in
            404)
              echo "${IMAGE}:${VERSION} is not published yet"
              echo "action=push" >> "$GITHUB_OUTPUT"
              ;;
            200)
              # wash pushes the component as the manifest's only layer.
              built="sha256:$(sha256sum "${ARTIFACT}.wasm" | cut -d' ' -f1)"
              if [ "$(jq -r '.layers[0].digest // empty' "$manifest")" = "$built" ]; then
                echo "::notice::${IMAGE}:${VERSION} already holds this build; attesting it"
                echo "action=attest" >> "$GITHUB_OUTPUT"
                echo "digest=sha256:$(sha256sum "$manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::${IMAGE}:${VERSION} is already published; bump the version in wit/llama.wit to release these changes"
                echo "action=skip" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::probing ${IMAGE}:${VERSION} returned HTTP ${status}"
              cat "$manifest"
              exit 1
              ;;
          esac

      - name: Push
        id: push
        if: steps.check.outputs.action == 'push'
        run: |
          set -euo pipefail
          # Prints {"success": true, "data": {"digest": "sha256:..."}, ...}. On
          # failure the error JSON also goes to stdout, so show it before exiting.
          if ! out=$(wash -o json oci push "${IMAGE}:${VERSION}" "${ARTIFACT}.wasm"); then
            echo "$out"
            exit 1
          fi
          echo "$out"
          digest=$(jq -r '.data.digest // empty' <<<"$out")
          [[ "$digest" == sha256:* ]] \
            || { echo "::error::wash oci push did not report a manifest digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.check.outputs.action != 'skip'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
          push-to-registry: true

      - name: Verify what landed
        if: steps.check.outputs.action != 'skip'
        # Read the WIT back out of the registry at the digest that was just
        # attested, the same way a consumer resolves it.
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
        run: |
          set -euo pipefail
          wash inspect "${IMAGE}@${DIGEST}" > "$RUNNER_TEMP/published.wit"
          for name in $INTERFACES; do
            interface="${PACKAGE}/${name}@${VERSION}"
            grep -qF "export ${interface};" "$RUNNER_TEMP/published.wit" \
              || { echo "::error::${IMAGE}@${DIGEST} does not export ${interface}"; exit 1; }
          done

      - name: Summary
        if: steps.check.outputs.action != 'skip'
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.check.outputs.digest }}
        run: |
          exports=""
          for name in $INTERFACES; do
            exports+="${exports:+, }\`${PACKAGE}/${name}@${VERSION}\`"
          done
          {
            echo "### Published \`${ARTIFACT}\` ${VERSION}"
            echo
            echo "Exports ${exports}."
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify the provenance attestation:"
            echo
            echo '```shell'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
