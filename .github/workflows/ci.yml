name: CI

# Builds the llama.cpp provider component with `wash build` and checks that it
# exports the interface declared in wit/. On main it also publishes the
# component to GHCR with a Sigstore-signed build-provenance attestation.
#
# The package version in wit/llama.wit is the release version. A merge to main
# that bumps it publishes that version; any other merge finds the version
# already there and skips, so a published version is never moved. The publish
# job pushes the exact bytes the build job produced and checked rather than
# rebuilding, so the attestation covers what was tested.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # Retries a publish from main without a new commit, e.g. after a registry outage.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR builds, but let main runs finish: cancelling one
  # mid-publish could leave a pushed version without its attestation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  WASI_SDK_VERSION: "34"
  WASH_VERSION: v2.9.0
  WASM_TOOLS_VERSION: 1.258.0
  # <registry>/<owner>/<repo>/<component>, the layout other cosmonic-labs
  # components publish under (e.g. ghcr.io/cosmonic-labs/yara-x-wasm/yara-x-scanner).
  IMAGE: ghcr.io/cosmonic-labs/llama.wit/llama-cpp

jobs:
  build:
    name: Build component
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      interface: ${{ steps.meta.outputs.interface }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package identity
        id: meta
        run: |
          set -euo pipefail
          # `package cosmonic:llama-cpp@0.4.0;` -> version 0.4.0, and the interface
          # the component has to export, cosmonic:llama-cpp/api@0.4.0.
          decl=$(grep -m1 -oE '^package [a-z0-9-]+:[a-z0-9-]+@[^;]+' wit/llama.wit) \
            || { echo "::error::could not read the package declaration from wit/llama.wit"; exit 1; }
          decl=${decl#package }
          version=${decl#*@}
          interface="${decl%%@*}/api@${version}"

          # The version becomes the OCI tag. Resolvers ignore tags that are not
          # valid semver, and OCI tags cannot contain the `+` of build metadata.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package version '$version' in wit/llama.wit is not <major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          {
            echo "version=$version"
            echo "interface=$interface"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, must export $interface"

      - name: Install wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c # v1.0.0
        with:
          version: ${{ env.WASI_SDK_VERSION }}
          # cmake/wasip3.toolchain.cmake only reads WASI_SDK_PATH, which is always
          # exported. Leave PATH, CC and CXX alone so nothing else in the job
          # silently picks up the wasm compiler.
          add-to-path: false

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}

      - name: Versions
        run: |
          wash --version
          wasm-tools --version
          "$WASI_SDK_PATH/bin/clang" --version
          cmake --version

      - name: Build
        # .wash/config.yaml runs the CMake configure + build.
        run: CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" wash build

      - name: Fail if wkg.lock moved
        # `wash build` fetches WIT dependencies and rewrites wkg.lock. A change
        # means the build resolved something nobody reviewed.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- wkg.lock)" ]; then
            echo "::error::wash build changed wkg.lock; commit the updated lock deliberately"
            git --no-pager diff -- wkg.lock
            exit 1
          fi

      - name: Assert the component exports the API
        # The C bindings in src/generated/ are committed, not generated during
        # the build. If wit/ changes (including a version bump) without
        # `regenerate-bindings`, the component still builds but exports the
        # stale interface.
        env:
          INTERFACE: ${{ steps.meta.outputs.interface }}
        run: |
          set -euo pipefail
          wash inspect build/llama-cpp.wasm > "$RUNNER_TEMP/component.wit"
          grep -E '^\s*(import|export) ' "$RUNNER_TEMP/component.wit"
          grep -qF "export ${INTERFACE};" "$RUNNER_TEMP/component.wit" \
            || { echo "::error::build/llama-cpp.wasm does not export ${INTERFACE}; regenerate the bindings"; exit 1; }

      - name: Embed provenance metadata
        # `wash oci push` maps these onto org.opencontainers.image.* annotations;
        # `source` is what links the GHCR package to this repository.
        env:
          INTERFACE: ${{ steps.meta.outputs.interface }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wasm-tools metadata add build/llama-cpp.wasm \
            --name llama-cpp \
            --version "$VERSION" \
            --description "llama.cpp inference, exporting ${INTERFACE}" \
            --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision "$GITHUB_SHA" \
            --output dist/llama-cpp.wasm
          wasm-tools metadata show dist/llama-cpp.wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-cpp
          path: dist/llama-cpp.wasm
          if-no-files-found: error

  publish:
    name: Publish to GHCR
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      # attest-build-provenance signs with a Sigstore certificate issued against
      # the job's OIDC token (id-token), stores the attestation with GitHub
      # (attestations) and records the artifact (artifact-metadata).
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      INTERFACE: ${{ needs.build.outputs.interface }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llama-cpp

      - uses: wasmCloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0
        with:
          wash-version: ${{ env.WASH_VERSION }}

      # wash, `docker manifest inspect` and the attestation push all read these
      # credentials.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: check
        # Only a merge that bumps the version publishes; every other merge stops
        # here. "Exists", "not found" and any other failure are told apart: an
        # inconclusive probe is no licence to push over what might be there.
        #
        # If a run pushed but then failed to attest, delete that version from
        # GHCR before re-running it; otherwise the re-run sees it as published
        # and skips.
        run: |
          set -euo pipefail
          ref="${IMAGE}:${VERSION}"
          if err=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
            echo "::notice::$ref is already published; bump the version in wit/llama.wit to release these changes"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|no such manifest|not found' <<<"$err"; then
            echo "$ref is not published yet"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check whether $ref exists"
            echo "$err"
            exit 1
          fi

      - name: Push
        id: push
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Prints {"success": true, "data": {"digest": "sha256:..."}, ...}.
          out=$(wash -o json oci push "${IMAGE}:${VERSION}" llama-cpp.wasm)
          echo "$out"
          digest=$(jq -r '.data.digest // empty' <<<"$out")
          [[ "$digest" == sha256:* ]] \
            || { echo "::error::wash oci push did not report a manifest digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.check.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify what landed
        if: steps.check.outputs.publish == 'true'
        # Read the WIT back out of the registry at the digest that was just
        # attested, the same way a consumer resolves it.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          wash inspect "${IMAGE}@${DIGEST}" > "$RUNNER_TEMP/published.wit"
          grep -qF "export ${INTERFACE};" "$RUNNER_TEMP/published.wit" \
            || { echo "::error::${IMAGE}@${DIGEST} does not export ${INTERFACE}"; exit 1; }

      - name: Summary
        if: steps.check.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published \`llama-cpp\` ${VERSION}"
            echo
            echo "Exports \`${INTERFACE}\`."
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify the provenance attestation:"
            echo
            echo '```shell'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
